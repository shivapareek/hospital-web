<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <title>CareNova admin</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..700&amp;family=Atkinson+Hyperlegible+Mono:wght@400..500&amp;display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <!-- Boot / loading -->
  <div id="boot" class="login-wrap" aria-live="polite">
    <div class="state"><span class="spinner" aria-hidden="true"></span><span class="sr-only">Loading</span></div>
  </div>

  <!-- Login -->
  <main id="login" class="login-wrap" hidden>
    <form class="login-card" id="login-form" novalidate>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <span>CareNova<small>Website admin</small></span>
      </div>
      <h1>Sign in</h1>
      <p class="lede">Use the email and password your administrator gave you.</p>
      <div id="login-error" class="alert alert-error" role="alert" hidden></div>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" id="login-submit">Sign in</button>
      <p class="help mt-16"><a href="/">Back to the website</a></p>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="shell" hidden>
    <header class="topbar">
      <button class="btn btn-ghost btn-icon" id="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>CareNova admin</span></span>
      <a class="btn btn-sm" href="/" target="_blank" rel="noopener">View site</a>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Main menu">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <span>CareNova<small>Website admin</small></span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="whoami" id="whoami"></div>
        <a class="btn btn-ghost" href="/" target="_blank" rel="noopener">View site <span class="sr-only">(opens in a new tab)</span></a>
        <button class="btn btn-ghost" type="button" id="logout-btn">Sign out</button>
      </div>
    </aside>
    <div class="scrim" id="nav-scrim" hidden></div>

    <div class="main">
      <div class="banner" id="pw-banner" role="status" hidden>
        <strong>Please change your password.</strong>
        <span>You are using a temporary password.</span>
        <a href="#/account">Go to My account</a>
      </div>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <div id="layers"></div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
